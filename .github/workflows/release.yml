name: Release

# Auto-release: push a version tag (e.g. `v0.1.0`) to build the Windows
# installers and publish them to a draft GitHub Release. Can also be run
# manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "@ign1s-reiga:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> .npmrc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The changelog, written once and used twice.
      #
      # `latest.json`'s `notes` field is not separately configurable: tauri-action
      # copies `releaseBody` into it verbatim. So the placeholder that used to sit
      # there reached further than the release page — `Settings → Software update`
      # renders these notes under a "Release notes" heading, and what it showed
      # somebody deciding whether to install was "See the assets below to download
      # and install this version", which is neither a change list nor advice they
      # can act on from inside the app.
      #
      # This is the same content the "Generate release notes" button produces, so
      # the draft arrives with it already filled in rather than waiting for
      # somebody to press that. Editing the body after this point does *not* reach
      # `latest.json` — the asset is uploaded during the build (see README).
      - name: Generate the changelog
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fallback="See the assets below to download and install this version."

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Read-only: this endpoint returns the notes for a tag, it does not
            # create or modify a release.
            body=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${{ github.ref_name }}" --jq '.body' || true)
          else
            # A manual run builds from a branch with no tag to compare against,
            # so there is no range to generate a changelog from.
            body=""
          fi

          # An empty body would publish a release, and an updater manifest, with
          # nothing written in either. Better the old placeholder than that.
          if [ -z "$body" ]; then
            echo "No generated notes; using the placeholder."
            body="$fallback"
          fi

          # A unique delimiter: the body is Markdown from PR titles and could
          # otherwise contain the terminator and truncate itself.
          {
            echo "body<<CHANGELOG_EOF_b7f21a"
            echo "$body"
            echo "CHANGELOG_EOF_b7f21a"
          } >> "$GITHUB_OUTPUT"

      # tauri-action runs `beforeBuildCommand` (pnpm run build -> ../out),
      # bundles the app, and uploads the installers to the release.
      #
      # The signing key also produces the updater artifacts (`*.nsis.zip` + its
      # `.sig`) and `latest.json`, which the in-app updater fetches from
      # `releases/latest/download/latest.json`. Publish the draft release for
      # installed apps to see the new version.
      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

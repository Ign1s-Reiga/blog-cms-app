name: CI

# Fast checks on pull requests and pushes to main so broken code never
# reaches a release tag.
#
# Pull requests are deliberately not filtered by base branch. A stacked PR
# opened against a feature branch would otherwise get no checks at all, and
# retargeting it to main doesn't fix that: the base change fires `edited`,
# which isn't one of `pull_request`'s default types, and the pushes that fire
# `synchronize` happened while the base was still filtered out. The PR then
# reads as ready to merge having never been built. Results attach per commit,
# so a stacked PR is checked when it opens and keeps those results through the
# retarget.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `@ign1s-reiga/marked-presets` is hosted on GitHub Packages, so installs
# need read access to it (see the "Authenticate to GitHub Packages" steps).
permissions:
  contents: read
  packages: read

jobs:
  frontend:
    name: Lint & build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "@ign1s-reiga:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm exec oxlint

      - name: Build static export
        run: pnpm run build

  backend:
    name: Check Rust backend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "@ign1s-reiga:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` embeds ../out at compile time, so the
      # frontend must be built before the Rust crate is checked.
      - name: Build static export
        run: pnpm run build

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  # `paths:` only exists on the workflow trigger, not per job, so filtering
  # there would skip the lint and check jobs too. This computes the answer for
  # the one expensive job instead.
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.filter.outputs.bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Does this change reach the installers?
        id: filter
        shell: bash
        run: |
          # Anything not a pull request (a manual run) has no base to diff
          # against, so it builds.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — building."
            exit 0
          fi

          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # The frontend is embedded in the installer, so a .tsx change does
          # alter the shipped binary — but `Lint & build frontend` already
          # compiles it, and what this job uniquely proves is NSIS/MSI
          # packaging, which turns on the Rust crate, the Tauri config, and the
          # dependency set. `ci.yml` is included so a change to this job is
          # still exercised by it.
          if echo "$changed" | grep -qE '^(src-tauri/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            echo "-> installers affected; building."
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing the installers depend on changed; skipping."
          fi

  bundle:
    name: Build installers
    runs-on: windows-latest
    needs: detect
    # Bundling only ever ran at tag time, so a change that broke the installers
    # surfaced during a release instead of on the PR that caused it. Skipped on
    # pushes to main, which are squash-merges of already-built pull requests,
    # and on changes that cannot reach the installers (see `detect`).
    if: github.event_name != 'push' && needs.detect.outputs.bundle == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "@ign1s-reiga:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tauri build` runs `beforeBuildCommand` itself, so the static export is
      # covered here. Updater artifacts are switched off because they require
      # the signing key, which is deliberately not exposed to pull requests
      # (and is unavailable to forks regardless). The NSIS/MSI bundling this
      # does exercise is the part that only ran at tag time before.
      - name: Build installers
        shell: bash
        run: pnpm exec tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          # Fail rather than publish an empty artifact if the bundle layout moves.
          if-no-files-found: error
          retention-days: 7

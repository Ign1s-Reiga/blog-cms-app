[package]
name = "blog-cms-app"
version = "1.5.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# Raised from the Tauri template's 1.77.2 by `rmcp`, which declares 1.88.
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
sea-orm = { version = "2.0.0-rc", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "net", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
keyring-core = "1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "avif"] }
sha2 = "0.10.9"
rmcp = { version = "3", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio"] }
schemars = "1"

# `tests/mcp_endpoint.rs` drives the MCP endpoint over real HTTP, which needs a
# multi-threaded runtime and `#[tokio::test]`.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# OS keychain backend for the Cloudflare API token. Windows Credential Manager
# on Windows; other platforms fall back to the credentials file for now.
#
# `webview2-com` reaches the WebView2 settings behind the main window (see
# `webview.rs`). Tauri re-exports these interfaces, so the version must track
# whatever `tauri` itself depends on — it bumps in Tauri's minor releases.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
webview2-com = "0.38"

# The AVIF encoder's dependency tree pushes the debug build past the Windows
# linker's PDB size cap (LNK1140) when linking the test binary. Line tables keep
# backtraces useful while cutting debug info to a fraction of full symbols.
[profile.dev]
debug = 1

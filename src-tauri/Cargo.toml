[package]
name = "blog-cms-app"
version = "1.0.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
sea-orm = { version = "2.0.0-rc", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "rt"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
keyring-core = "1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "avif"] }

# OS keychain backend for the Cloudflare API token. Windows Credential Manager
# on Windows; other platforms fall back to the credentials file for now.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
